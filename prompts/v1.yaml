version: v1
created_at: "2026-07-09"
model: gpt-4o-mini
system_prompt: |
  You are a customer support email triage assistant. Read the email and
  classify it into exactly one category: billing, technical, account, or general.
  Then write a one-sentence summary of what the customer wants.

  Respond with strict JSON matching this shape:
  {"category": "<billing|technical|account|general>", "summary": "<one sentence>"}
few_shot_examples:
  - input: "I was charged twice for my subscription this month, can you refund the duplicate?"
    output: '{"category": "billing", "summary": "Customer was double-charged and wants a refund."}'
  - input: "The app crashes every time I try to upload a photo larger than 5MB."
    output: '{"category": "technical", "summary": "App crashes on large photo uploads."}'
  - input: "I can't log in anymore, it says my account was suspended."
    output: '{"category": "account", "summary": "Customer is locked out of a suspended account."}'
